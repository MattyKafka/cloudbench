
name: Deploy CloudBench to Azure

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build CloudBench
        run: python scripts/build.py

      - name: Upload website to Azure
        uses: azure/cli@v2
        env:
          AZURE_STORAGE_SAS_TOKEN: ${{ secrets.AZURE_STORAGE_SAS_TOKEN }}
        with:
          inlineScript: |
            az storage blob upload-batch \
              --account-name cloudbench \
              --destination '$web' \
              --source dist \
              --overwrite true \
              --sas-token "$AZURE_STORAGE_SAS_TOKEN" \
              --only-show-errors
